name: UI CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: obsidian-ui
    steps:
      - name: Check out the UI
        uses: actions/checkout@v4
        with:
          path: obsidian-ui

      # contracts/manifest-v5.lock.json is a MIRROR of the producer's
      # declaration in core (system/contracts/manifest-contract.yaml), and
      # scripts/check-contract.mjs can only compare the two when core sits at
      # ../repository. Until 2026-08-18 this job checked out only the UI, so
      # that comparison never ran here: it printed "core not checked out beside
      # this repo" and passed. The one contract in the system enforced by memory
      # rather than by code was the one guarding "core ships a shape the UI does
      # not know about" — the exact failure the producer-owned-contract design
      # was written in response to. Checking core out is what makes it run.
      #
      # The path must be a sibling of obsidian-ui inside the workspace, which is
      # why the UI is no longer checked out at the workspace root.
      #
      # Prefer a same-named Core branch when one exists, otherwise use main.
      # A cross-repository change can therefore verify the pair under review
      # without a permanent branch pin; ordinary UI-only branches still test
      # against the released Core line.
      - name: Resolve the matching producer branch
        id: producer-ref
        env:
          REQUESTED_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads \
            https://github.com/Aram164/LearningOS.git \
            "refs/heads/$REQUESTED_REF" >/dev/null 2>&1; then
            echo "ref=$REQUESTED_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the producer of the manifest contract
        uses: actions/checkout@v4
        with:
          repository: Aram164/LearningOS
          ref: ${{ steps.producer-ref.outputs.ref }}
          path: repository

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned development dependencies
        run: npm ci --ignore-scripts

      # CI is set, so check-contract.mjs now refuses to pass on an unverified
      # mirror instead of skipping it.
      - name: Typecheck, contract-check, build and test
        run: npm run check

      - name: Exercise the fixture installer path
        run: python3 install.py --vault fixture-vault --dry-run --node "$(command -v node)"

      - name: Upload built plugin
        uses: actions/upload-artifact@v4
        with:
          name: learningos-ui-plugin
          path: obsidian-ui/plugin/
          if-no-files-found: error
