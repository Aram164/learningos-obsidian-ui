name: UI CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: obsidian-ui
    steps:
      - name: Check out the UI
        uses: actions/checkout@v4
        with:
          path: obsidian-ui

      # contracts/manifest-v5.lock.json is a MIRROR of the producer's
      # declaration in core (system/contracts/manifest-contract.yaml), and
      # scripts/check-contract.mjs can only compare the two when core sits at
      # ../repository. Until 2026-08-18 this job checked out only the UI, so
      # that comparison never ran here: it printed "core not checked out beside
      # this repo" and passed. The one contract in the system enforced by memory
      # rather than by code was the one guarding "core ships a shape the UI does
      # not know about" — the exact failure the producer-owned-contract design
      # was written in response to. Checking core out is what makes it run.
      #
      # The path must be a sibling of obsidian-ui inside the workspace, which is
      # why the UI is no longer checked out at the workspace root.
      #
      # No `ref:` — core is checked out at its default branch, which is the
      # branch this repository's default branch is released with.
      #
      # There was a pin here until 2026-08-21 (`ref: engineering-review-tier1`,
      # and before that `feature/interaction-redesign-core-v1`), because the
      # contract release genuinely lived on a branch on both sides while core's
      # `main` still predated system/contracts/ entirely. Pinning was the honest
      # form of "released together" while that was true. What made it worth
      # removing was not that it stopped being honest — it was that both
      # workflows had come to pin *each other* at the same branch name, so the
      # pair verified against itself while both mains sat 60 and 68 commits
      # behind and unexercised. That arrangement is correct exactly until
      # someone renames or deletes a branch, at which point CI fails for a
      # reason that has nothing to do with the contract.
      #
      # Both branches were fast-forwarded onto their mains, so the pairing this
      # job verifies is now the pairing that ships. Do not reintroduce a `ref:`
      # without also writing down what removes it again.
      - name: Check out the producer of the manifest contract
        uses: actions/checkout@v4
        with:
          repository: Aram164/LearningOS
          path: repository

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned development dependencies
        run: npm install --ignore-scripts

      # CI is set, so check-contract.mjs now refuses to pass on an unverified
      # mirror instead of skipping it.
      - name: Typecheck, contract-check, build and test
        run: npm run check

      - name: Exercise the fixture installer path
        run: python3 install.py --vault fixture-vault --dry-run --node "$(command -v node)"

      - name: Upload built plugin
        uses: actions/upload-artifact@v4
        with:
          name: learningos-ui-plugin
          path: obsidian-ui/plugin/
          if-no-files-found: error
